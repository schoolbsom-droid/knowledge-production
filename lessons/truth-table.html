<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جدول الحقيقة التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: header + 3 tabs (المختبر: switches/circuit/live table · ابني الجدول: fill the result column · تحدّي السرعة: 10 story/code questions) */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#16302C; --muted:#5B706B; --line:#D5E0DC;
  --accent:#0B7A66; --accent-soft:#DCEFEA; --hl:#FFD54A;
  --ok:#1F8A4C; --ok-soft:#E1F3E7; --bad:#C2413A; --bad-soft:#FBE5E3;
  --code-bg:#10231F; --code-fg:#E7F2EE;
  --tk-fn:#7FD3FF; --tk-kw:#FF9EC7; --tk-bool:#9EF0B8;
  --bulb-off:#C9D3D0; --glow:#FFC83D; --wire:#16302C;
  --c-and:#3D6FD8; --c-or:#B4590E; --c-not:#8A3FC0;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1917; --surface:#15231F; --ink:#E3EEEA; --muted:#93A8A2; --line:#26403A;
  --accent:#3CC3A6; --accent-soft:#163A33;
  --ok:#4CC27E; --ok-soft:#143525; --bad:#F07A72; --bad-soft:#3E1D1B;
  --code-bg:#0A1311; --bulb-off:#3A4B47; --glow:#FFD25A; --wire:#C9DAD5;
  --c-and:#7FA4FF; --c-or:#F0A35C; --c-not:#C38AF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#15231F; --ink:#E3EEEA; --muted:#93A8A2; --line:#26403A;
  --accent:#3CC3A6; --accent-soft:#163A33;
  --ok:#4CC27E; --ok-soft:#143525; --bad:#F07A72; --bad-soft:#3E1D1B;
  --code-bg:#0A1311; --bulb-off:#3A4B47; --glow:#FFD25A; --wire:#C9DAD5;
  --c-and:#7FA4FF; --c-or:#F0A35C; --c-not:#C38AF0; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.3;margin:0}
h1 .op{font-family:var(--f-mono);background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 4px}
h2{font-family:var(--f-display);font-size:19px;margin:0}
.lead{color:var(--muted);margin:4px 0 0}
code,pre,.mono{font-family:var(--f-mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;direction:ltr;unicode-bidi:isolate}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{flex:1;font:inherit;font-family:var(--f-display);font-weight:500;font-size:15px;border:0;border-radius:10px;padding:9px 6px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-family:var(--f-mono);font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;font-variant-ligatures:none}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}

.hook{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--surface))}
.hook b{font-family:var(--f-display);color:var(--c);font-size:17px}
.hook .tag{font-family:var(--f-mono);font-weight:700;color:#fff;background:var(--c);border-radius:8px;padding:2px 10px}

.lab{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:640px){.lab{grid-template-columns:1fr}}
.switches{display:flex;gap:10px}
.sw{flex:1;font:inherit;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s,border-color .2s}
.sw .n{font-family:var(--f-mono);font-weight:700;font-size:20px}
.sw .v{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.sw.on{background:color-mix(in srgb,var(--glow) 22%,var(--surface));border-color:var(--glow)}
.sw.on .v{color:var(--ink);font-weight:700}
svg.circ{width:100%;height:auto;display:block;background:var(--bg);border-radius:14px}
.w{stroke:var(--wire);stroke-width:3;stroke-linecap:round;fill:none}
.lit .w{stroke:var(--glow)}
.flow{stroke:#fff;stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round;fill:none;opacity:.85;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.lbl{fill:var(--ink);font-family:var(--f-mono);font-weight:700;font-size:14px}
.sub{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg.circ text{direction:ltr}

pre.code{margin:0;text-align:left;background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.75;overflow-x:auto}
.tk-kw{color:var(--tk-kw)}.tk-b{color:var(--tk-bool)}.tk-fn{color:var(--tk-fn)}
.out{display:block;color:var(--glow);border-top:1px dashed #ffffff30;margin-top:6px;padding-top:6px}

table.tt{width:100%;border-collapse:separate;border-spacing:0 6px;text-align:center}
.tt th{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-weight:700;padding:4px;font-variant-ligatures:none}
.tt th.res{color:var(--c)}
.tt td{padding:0}
.tt tr.row{cursor:pointer}
.tt tr.row td>span,.tt .cell{display:block;margin:0 3px;border-radius:10px;padding:7px 4px;font-family:var(--f-mono);font-weight:700;font-size:14px;background:var(--bg);border:1.5px solid transparent;transition:transform .15s}
.tt tr.cur td>span{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 18%,var(--surface))}
.T{color:var(--ok)}.F{color:var(--bad)}
.tt .cell{width:calc(100% - 6px);cursor:pointer;font:inherit;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.tt .cell.right{background:var(--ok-soft);border-color:var(--ok)}
.tt .cell.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{font-size:14px;color:var(--muted);margin:0}

.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--f-display);font-weight:500;font-size:16px;border-radius:10px;padding:9px 22px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.fb{border-radius:12px;padding:12px 16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb strong{font-family:var(--f-display);display:block;font-size:16px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.streak{font-family:var(--f-display);font-weight:700;color:var(--c-or)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.story{font-family:var(--f-display);font-size:18px;font-weight:500;margin:0;line-height:1.7}
.story em{font-style:normal;font-family:var(--f-mono);font-weight:700;color:var(--c);padding:0 3px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{font:inherit;font-family:var(--f-mono);font-weight:700;font-size:20px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ans button.right{background:var(--ok-soft);border-color:var(--ok)}
.ans button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.ans button:disabled{cursor:default}
.big{font-family:var(--f-display);font-size:48px;font-weight:700;text-align:center;margin:0;color:var(--accent)}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>جدول الحقيقة <span class="op">and or not</span></h1>
    <p class="lead">شغّلي المفاتيح، وراقبي المصباح، واكتشفي القاعدة بنفسك.</p>
    <a class="btn ghost" href="whiteboard.html" target="_blank" style="align-self:flex-start;text-decoration:none;font-size:14px;padding:6px 14px">افتحي السبورة التفاعلية</a>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="lab" aria-selected="true">المختبر</button>
    <button class="tab" role="tab" data-t="build" aria-selected="false">ابني الجدول</button>
    <button class="tab" role="tab" data-t="quiz" aria-selected="false">تحدّي السرعة</button>
  </nav>

  <section id="lab" class="card"></section>
  <section id="build" class="card" hidden></section>
  <section id="quiz" class="card" hidden></section>
</div>

<script>
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const P=b=>b?'True':'False';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(/\b(and|or|not|True|False|print)\b/g,m=>`<span class="${m==='print'?'tk-fn':/True|False/.test(m)?'tk-b':'tk-kw'}">${m}</span>`);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const OPS={
  and:{c:'var(--c-and)',f:(a,b)=>a&&b,n:2,hook:'لازم الاثنين',why:'مثل باب له قفلان: لا يُفتح إلا إذا فُتح القفلان معًا. الناتج True فقط إذا كان الطرفان True.',circ:'المفتاحان على سلك واحد (توالي): يكفي مفتاح مطفأ واحد ليقطع التيار.'},
  or:{c:'var(--c-or)',f:(a,b)=>a||b,n:2,hook:'واحد يكفي',why:'مثل غرفة لها بابان: تدخلين من أيّ باب مفتوح. الناتج False فقط إذا كان الطرفان False.',circ:'لكل مفتاح طريقه الخاص (توازي): يكفي مفتاح مشغَّل واحد ليصل التيار.'},
  not:{c:'var(--c-not)',f:a=>!a,n:1,hook:'اقلبيها',why:'مثل المرآة: تعكس القيمة. not True تصبح False، و not False تصبح True.',circ:'جسر يقطع الدائرة: عندما تكون A = True يرتفع الجسر وينطفئ المصباح.'}
};
const ROWS2=[[true,true],[true,false],[false,true],[false,false]], ROWS1=[[true],[false]];

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  ['lab','build','quiz'].forEach(id=>document.getElementById(id).hidden=id!==t.dataset.t);
});

/* ---------- circuit ---------- */
function circuit(op,A,B,on){
  const L=(x1,y1,x2,y2)=>`M${x1} ${y1}L${x2} ${y2}`;
  const sw=(x1,x2,y,closed,name,val)=>`<circle cx="${x1}" cy="${y}" r="4" fill="var(--wire)"/><circle cx="${x2}" cy="${y}" r="4" fill="var(--wire)"/>
    <line x1="${x1}" y1="${y}" x2="${closed?x2:x2-8}" y2="${closed?y:y-24}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <text class="lbl" x="${(x1+x2)/2}" y="${y+22}" text-anchor="middle">${name} = ${P(val)}</text>`;
  let d=[L(40,30,40,130),L(40,150,40,200),L(40,200,320,200),L(320,200,320,136),L(320,104,320,30)], parts='';
  if(op==='and'){
    d.push(L(40,30,100,30),L(140,30,190,30),L(230,30,320,30));
    parts=sw(190,230,30,A,'A',A)+sw(100,140,30,B,'B',B);
  }else if(op==='or'){
    d.push(L(40,30,130,30),L(170,30,320,30),L(40,95,130,95),L(170,95,260,95),L(260,95,260,30));
    parts=sw(130,170,30,A,'A',A)+sw(130,170,95,B,'B',B);
  }else{
    d.push(L(40,30,150,30),L(210,30,320,30));
    const y=A?8:30;
    parts=`<circle cx="150" cy="30" r="4" fill="var(--wire)"/><circle cx="210" cy="30" r="4" fill="var(--wire)"/>
      <rect x="144" y="${y-4}" width="72" height="8" rx="3" fill="var(--c-not)" style="transition:y .25s"/>
      <text class="lbl" x="180" y="62" text-anchor="middle">A = ${P(A)}</text><text class="sub" x="180" y="80" text-anchor="middle">${A?'الجسر مرفوع':'الجسر يوصل'}</text>`;
  }
  const path=d.join('');
  const rays=on?[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${320+Math.cos(r)*22}" y1="${120+Math.sin(r)*22}" x2="${320+Math.cos(r)*30}" y2="${120+Math.sin(r)*30}" stroke="var(--glow)" stroke-width="3" stroke-linecap="round"/>`}).join(''):'';
  return `<svg class="circ ${on?'lit':''}" viewBox="0 0 360 225" role="img" aria-label="الدائرة الكهربائية، المصباح ${on?'مضيء':'مطفأ'}">
    <path class="w" d="${path}"/>${on?`<path class="flow" d="${path}"/>`:''}
    <line x1="26" y1="130" x2="54" y2="130" stroke="var(--ink)" stroke-width="3"/><line x1="33" y1="150" x2="47" y2="150" stroke="var(--ink)" stroke-width="6"/>
    <text class="sub" x="62" y="146">البطارية</text>
    ${parts}
    ${rays}<circle cx="320" cy="120" r="16" fill="${on?'var(--glow)':'var(--bulb-off)'}" stroke="var(--ink)" stroke-width="2" style="${on?'filter:drop-shadow(0 0 10px var(--glow))':''}"/>
    <text class="sub" x="296" y="166" text-anchor="end">${on?'المصباح مضيء':'المصباح مطفأ'}</text>
  </svg>`;
}

/* ---------- lab ---------- */
const lab={op:'and',A:true,B:false};
function opChips(cur,attr){return `<div class="seg">${Object.keys(OPS).map(k=>`<button class="chip" style="--c:${OPS[k].c}" data-${attr}="${k}" aria-pressed="${k===cur}">${k}</button>`).join('')}</div>`}
function renderLab(){
  const o=OPS[lab.op], expr=o.n===2?`A ${lab.op} B`:'not A', r=o.n===2?o.f(lab.A,lab.B):o.f(lab.A);
  const rows=o.n===2?ROWS2:ROWS1;
  const code=(o.n===2?`A = ${P(lab.A)}\nB = ${P(lab.B)}\n`:`A = ${P(lab.A)}\n`)+`print(${expr})`;
  document.getElementById('lab').innerHTML=`
    ${opChips(lab.op,'op')}
    <div class="hook" style="--c:${o.c}"><span class="tag">${lab.op}</span><div><b>«${o.hook}»</b><br>${o.why}</div></div>
    <div class="lab">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="switches">
          <button class="sw ${lab.A?'on':''}" data-sw="A"><span class="n">A</span><span class="v">${P(lab.A)}</span></button>
          ${o.n===2?`<button class="sw ${lab.B?'on':''}" data-sw="B"><span class="n">B</span><span class="v">${P(lab.B)}</span></button>`:''}
        </div>
        ${circuit(lab.op,lab.A,lab.B,r)}
        <p class="hint">${o.circ}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <pre class="code">${hl(code)}<span class="out">&gt;&gt;&gt; ${hl(P(r))}</span></pre>
        <table class="tt" style="--c:${o.c}">
          <thead><tr><th>A</th>${o.n===2?'<th>B</th>':''}<th class="res">${expr}</th></tr></thead>
          <tbody>${rows.map(([a,b])=>{const v=o.n===2?o.f(a,b):o.f(a), cur=a===lab.A&&(o.n===1||b===lab.B);
            return `<tr class="row ${cur?'cur':''}" data-a="${a}" data-b="${b}"><td><span class="${a?'T':'F'}">${P(a)}</span></td>${o.n===2?`<td><span class="${b?'T':'F'}">${P(b)}</span></td>`:''}<td><span class="${v?'T':'F'}">${P(v)}</span></td></tr>`}).join('')}</tbody>
        </table>
        <p class="hint">اضغطي أي صف في الجدول لتجربيه على الدائرة.</p>
      </div>
    </div>`;
}
document.getElementById('lab').addEventListener('click',e=>{
  const c=e.target.closest('[data-op]'), s=e.target.closest('[data-sw]'), r=e.target.closest('tr.row');
  if(c) lab.op=c.dataset.op;
  else if(s) lab[s.dataset.sw]=!lab[s.dataset.sw];
  else if(r){lab.A=r.dataset.a==='true';if(r.dataset.b!=='undefined')lab.B=r.dataset.b==='true'}
  else return;
  renderLab();
});

/* ---------- build ---------- */
const LEVELS=[
  {e:'A and B',cols:[{h:'A and B',f:(a,b)=>a&&b}]},
  {e:'A or B',cols:[{h:'A or B',f:(a,b)=>a||b}]},
  {e:'not A',n:1,cols:[{h:'not A',f:a=>!a}]},
  {e:'A and not B',cols:[{h:'not B',f:(a,b)=>!b},{h:'A and not B',f:(a,b)=>a&&!b}]},
  {e:'not (A or B)',cols:[{h:'A or B',f:(a,b)=>a||b},{h:'not (A or B)',f:(a,b)=>!(a||b)}]},
  {e:'not A or B',cols:[{h:'not A',f:a=>!a},{h:'not A or B',f:(a,b)=>!a||b}]}
];
const bld={lv:0,ans:{},checked:false,done:new Set()};
function renderBuild(){
  const L=LEVELS[bld.lv], rows=L.n===1?ROWS1:ROWS2;
  let right=0,total=rows.length*L.cols.length;
  const body=rows.map(([a,b],i)=>`<tr><td><span class="${a?'T':'F'}">${P(a)}</span></td>${L.n===1?'':`<td><span class="${b?'T':'F'}">${P(b)}</span></td>`}${L.cols.map((c,j)=>{
    const k=i+'-'+j, v=bld.ans[k], st=bld.checked&&v!==undefined?(v===c.f(a,b)?'right':'wrong'):'';
    if(st==='right')right++;
    return `<td><button class="cell ${st}" data-k="${k}">${v===undefined?'؟':`<span class="${v?'T':'F'}">${P(v)}</span>`}</button></td>`}).join('')}</tr>`).join('');
  const all=bld.checked&&right===total; if(all)bld.done.add(bld.lv);
  document.getElementById('build').innerHTML=`
    <div><h2>املئي عمود الناتج</h2><p class="hint">اضغطي على كل ؟ لتبدّلي بين True و False، ثم اضغطي «تحقّقي». الأعمدة الإضافية خطوات تساعدك في التعبيرات المركّبة.</p></div>
    <div class="seg">${LEVELS.map((l,i)=>`<button class="chip" style="--c:var(--accent)" data-lv="${i}" aria-pressed="${i===bld.lv}">${bld.done.has(i)?'✓ ':''}${esc(l.e)}</button>`).join('')}</div>
    <table class="tt" style="--c:var(--accent)"><thead><tr><th>A</th>${L.n===1?'':'<th>B</th>'}${L.cols.map((c,j)=>`<th class="${j===L.cols.length-1?'res':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
    ${bld.checked?(all?`<div class="fb ok"><strong>أحسنتِ! الجدول صحيح بالكامل.</strong>${bld.lv<LEVELS.length-1?'جرّبي المستوى التالي.':'أنهيتِ كل المستويات.'}</div>`
      :`<div class="fb bad"><strong>${ar(right)} من ${ar(total)} صحيحة</strong>راجعي الخانات الحمراء. تذكّري: and «لازم الاثنين»، or «واحد يكفي»، not «اقلبيها».</div>`):''}
    <div class="btns"><button class="btn" data-act="check">تحقّقي</button>${all&&bld.lv<LEVELS.length-1?'<button class="btn ghost" data-act="next">المستوى التالي</button>':''}<button class="btn ghost" data-act="reset">امسحي</button></div>`;
}
document.getElementById('build').addEventListener('click',e=>{
  const lv=e.target.closest('[data-lv]'), c=e.target.closest('[data-k]'), act=e.target.closest('[data-act]');
  if(lv){bld.lv=+lv.dataset.lv;bld.ans={};bld.checked=false}
  else if(c){const k=c.dataset.k;bld.ans[k]=bld.ans[k]===undefined?true:!bld.ans[k];bld.checked=false}
  else if(act){const a=act.dataset.act;
    if(a==='check')bld.checked=true;
    if(a==='reset'){bld.ans={};bld.checked=false}
    if(a==='next'){bld.lv++;bld.ans={};bld.checked=false}}
  else return;
  renderBuild();
});

/* ---------- quiz ---------- */
const STORIES=[
  {op:'and',t:'تدخل الطالبة معمل الحاسب إذا كان معها كرت الدخول <em>and</em> كانت المعلمة موجودة.',v:['has_card','teacher_in'],q:'هل تدخل المعمل؟'},
  {op:'or',t:'تكون الفسحة داخل المبنى إذا كان الجو ممطرًا <em>or</em> حارًا جدًا.',v:['is_rainy','is_hot'],q:'هل الفسحة داخل المبنى؟'},
  {op:'not',t:'تُسجَّل الطالبة «حاضرة» إذا <em>not</em> كانت غائبة.',v:['absent'],q:'هل تُسجَّل حاضرة؟'},
  {op:'and',t:'يعمل الجهاز اللوحي في الحصة إذا كان مشحونًا <em>and</em> متصلًا بالشبكة.',v:['charged','wifi_on'],q:'هل يعمل الجهاز؟'},
  {op:'or',t:'تُكرَّم الطالبة إذا حصلت على شهادة <em>or</em> كان مشروعها الأفضل.',v:['has_cert','best_project'],q:'هل تُكرَّم الطالبة؟'},
  {op:'andnot',t:'تحصل الطالبة على نجمة إذا أنهت الواجب <em>and not</em> تأخرت.',v:['done_hw','late'],q:'هل تحصل على نجمة؟'}
];
const PURE=['A and B','A or B','not A','not B','A and not B','not A or B','not (A or B)','A or not B'];
const evalExpr=(e,A,B)=>Function('A','B','return '+e.replace(/\band\b/g,'&&').replace(/\bor\b/g,'||').replace(/\bnot\b/g,'!'))(A,B);
function makeQuiz(){
  const rb=()=>Math.random()<.5;
  const s=shuffle(STORIES.slice()).map(x=>{const vals=x.v.map(rb), expr=x.op==='andnot'?`${x.v[0]} and not ${x.v[1]}`:x.op==='not'?`not ${x.v[0]}`:`${x.v[0]} ${x.op} ${x.v[1]}`;
    return {story:x.t,q:x.q,code:x.v.map((n,i)=>`${n} = ${P(vals[i])}`).join('\n')+`\nprint(${expr})`,a:evalExpr(expr.replace(x.v[0],'A').replace(x.v[1]||'#','B'),vals[0],vals[1]),sub:x.v.reduce((e,n,i)=>e.replace(n,P(vals[i])),expr),op:x.op==='andnot'?'and':x.op}});
  const p=shuffle(PURE.slice()).slice(0,4).map(e=>{const A=rb(),B=rb();
    return {story:'ما ناتج تنفيذ البرنامج؟',q:'',code:`A = ${P(A)}\nB = ${P(B)}\nprint(${e})`,a:evalExpr(e,A,B),sub:e.replace(/\bA\b/g,P(A)).replace(/\bB\b/g,P(B)),op:/\band\b/.test(e)?'and':/\bor\b/.test(e)?'or':'not'}});
  return shuffle(s.concat(p)).slice(0,10);
}
let qz;
function startQuiz(){qz={list:makeQuiz(),i:0,score:0,streak:0,best:0,pick:null};renderQuiz()}
function renderQuiz(){
  const el=document.getElementById('quiz');
  if(qz.i>=qz.list.length){
    const msg=qz.score>=9?'ممتاز! أنتِ خبيرة جداول الحقيقة.':qz.score>=6?'جيد جدًا، راجعي القواعد الثلاث وجرّبي مرة أخرى.':'ارجعي إلى «المختبر» وجرّبي المفاتيح، ثم أعيدي التحدي.';
    el.innerHTML=`<p class="big">${ar(qz.score)} / ${ar(qz.list.length)}</p><p class="center"><b>${msg}</b><br>أطول سلسلة صحيحة: ${ar(qz.best)}</p><div class="btns" style="justify-content:center"><button class="btn" data-act="again">تحدٍّ جديد</button></div>`;return;
  }
  const q=qz.list[qz.i], o=OPS[q.op], done=qz.pick!==null;
  el.innerHTML=`
    <div class="top"><span>السؤال ${ar(qz.i+1)} من ${ar(qz.list.length)}</span><span class="streak">${qz.streak>1?`سلسلة صحيحة: ${ar(qz.streak)}`:''}</span><span>النقاط: ${ar(qz.score)}</span></div>
    <div class="bar"><i style="width:${qz.i/qz.list.length*100}%"></i></div>
    <p class="story" style="--c:${o.c}">${q.story}${q.q?` <br><b>${q.q}</b>`:''}</p>
    <pre class="code">${hl(q.code)}</pre>
    <div class="ans">${[true,false].map(v=>`<button data-v="${v}" ${done?'disabled':''} class="${done&&v===q.a?'right':done&&v===qz.pick?'wrong':''}">${P(v)}</button>`).join('')}</div>
    ${done?`<div class="fb ${qz.pick===q.a?'ok':'bad'}"><strong>${qz.pick===q.a?'إجابة صحيحة':'إجابة غير صحيحة، والصحيحة: '+P(q.a)}</strong>بعد التعويض: <code>${hl(q.sub)}</code> ← <code>${hl(P(q.a))}</code>. قاعدة ${q.op}: «${o.hook}».</div>
      <div class="btns"><button class="btn" data-act="next">${qz.i<qz.list.length-1?'السؤال التالي':'النتيجة'}</button></div>`:''}`;
}
document.getElementById('quiz').addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'), act=e.target.closest('[data-act]');
  if(v&&qz.pick===null){qz.pick=v.dataset.v==='true';const ok=qz.pick===qz.list[qz.i].a;
    if(ok){qz.score++;qz.streak++;qz.best=Math.max(qz.best,qz.streak)}else qz.streak=0;renderQuiz()}
  else if(act){if(act.dataset.act==='next'){qz.i++;qz.pick=null;renderQuiz()}else startQuiz()}
});

renderLab();renderBuild();startQuiz();
</script>
